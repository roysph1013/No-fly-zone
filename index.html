    function calculateDistanceNM(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return (R * c * 0.539957).toFixed(0);
    }

    function destinationPoint(lat, lon, distanceNM, bearingDeg) {
        const R = 6371;
        const d = (distanceNM * 1.852) / R;
        const brng = bearingDeg * Math.PI / 180;
        const lat1 = lat * Math.PI / 180;
        const lon1 = lon * Math.PI / 180;

        const lat2 = Math.asin(Math.sin(lat1) * Math.cos(d) + Math.cos(lat1) * Math.sin(d) * Math.cos(brng));
        const lon2 = lon1 + Math.atan2(Math.sin(brng) * Math.sin(d) * Math.cos(lat1), Math.cos(d) - Math.sin(lat1) * Math.sin(lat2));

        return {
            lat: lat2 * 180 / Math.PI,
            lon: lon2 * 180 / Math.PI
        };
    }

    function calculateBearing(lat1, lon1, lat2, lon2) {
        const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
        const Δλ = (lon2 - lon1) * Math.PI / 180;
        const y = Math.sin(Δλ) * Math.cos(φ2);
        const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
        const θ = Math.atan2(y, x);
        return (θ * 180 / Math.PI + 360) % 360;
    }

    function parseDirectionToBearing(text) {
        if (!text) return 0;
        text = text.trim();
        const baseMap = {
            '正東': 90, '正南': 180, '正西': 270, '正北': 0,
            '東': 90, '南': 180, '西': 270, '北': 0,
            '東北': 45, '東南': 135, '西南': 225, '西北': 315
        };

        const offsetMatch = text.match(/(正東|正南|正西|正北|東|南|西|北)(?:偏|向)(東|南|西|北)\s*(\d+(?:\.\d+)?)/);
        if (offsetMatch) {
            const baseDir = offsetMatch[1];
            const turnDir = offsetMatch[2];
            const deg = parseFloat(offsetMatch[3]);
            let baseAngle = baseMap[baseDir] !== undefined ? baseMap[baseDir] : 0;
            if (turnDir === '東' || turnDir === 'E') return (baseAngle + deg) % 360;
            if (turnDir === '西' || turnDir === 'W') return (baseAngle - deg + 360) % 360;
            if (turnDir === '南' || turnDir === 'S') return (baseAngle + deg) % 360;
            if (turnDir === '北' || turnDir === 'N') return (baseAngle - deg + 360) % 360;
        }

        if (baseMap[text] !== undefined) return baseMap[text];
        return 0;
    }

    function normalizeChineseCoordText(text) {
        return text
            .replace(/北緯|北纬/g, ' N')
            .replace(/南緯|南纬/g, ' S')
            .replace(/東經|东经/g, ' E')
            .replace(/西經|西经/g, ' W')
            .replace(/[度分秒]/g, ' ');
    }

    function parseSingleCoordinate(str, isLongitude) {
        if (!str) return null;
        str = str.trim().toUpperCase();

        let dir = null;
        if (str.includes('N') || str.includes('S') || str.includes('E') || str.includes('W')) {
            dir = str.match(/[NSEW]/)[0];
            str = str.replace(/[NSEW]/g, '');
        }

        str = str.replace(/[°'"]\s*/g, ' ').replace(/[-–]/g, ' ').trim();
        
        if ((str.match(/\./g) || []).length > 1) {
            str = str.replace(/\./g, ' ');
        }

        // 保留原始字串 token（含前導零），避免先轉成 Number 再轉回字串時遺失前導零
        // （例如 "091600" 轉成數字 91600 再轉回字串會變成 "91600"，少一碼，導致度分秒切法整個跑掉）
        const rawTokens = str.split(/\s+/).filter(s => s.length > 0);
        const numTokens = rawTokens.map(Number).filter(n => !isNaN(n));

        let val = 0;
        if (rawTokens.length === 1 && numTokens.length === 1) {
            let numStr = rawTokens[0];
            if (numStr.includes('.')) {
                let degLen = isLongitude ? (numStr.indexOf('.') === 5 ? 3 : 2) : (numStr.indexOf('.') === 4 ? 2 : 2);
                if (numStr.indexOf('.') > 3) {
                    let d = parseFloat(numStr.substring(0, degLen));
                    let m = parseFloat(numStr.substring(degLen));
                    val = d + m / 60.0;
                } else {
                    val = numTokens[0];
                }
            } else {
                if (numStr.length >= 6) {
                    let d = parseFloat(numStr.substring(0, numStr.length - 4));
                    let m = parseFloat(numStr.substring(numStr.length - 4, numStr.length - 2));
                    let s = parseFloat(numStr.substring(numStr.length - 2));
                    val = d + m / 60.0 + s / 3600.0;
                } else if (numStr.length >= 4) {
                    let d = parseFloat(numStr.substring(0, numStr.length - 2));
                    let m = parseFloat(numStr.substring(numStr.length - 2));
                    val = d + m / 60.0;
                } else {
                    val = numTokens[0];
                }
            }
        } else if (numTokens.length === 2) {
            val = numTokens[0] + numTokens[1] / 60.0;
        } else if (numTokens.length >= 3) {
            val = numTokens[0] + numTokens[1] / 60.0 + numTokens[2] / 3600.0;
        }

        if (dir === 'S' || dir === 'W') val = -val;
        return val;
    }

    function formatCoordString(lat, lon) {
        function toDMM(val, isLat) {
            const absVal = Math.abs(val);
            const deg = Math.floor(absVal);
            const min = ((absVal - deg) * 60).toFixed(2);
            const minStr = min < 10 ? '0' + min : min;
            const dir = isLat ? (val >= 0 ? 'N' : 'S') : (val >= 0 ? 'E' : 'W');
            return `${deg}-${minStr}${dir}`;
        }
        return {
            latStr: toDMM(lat, true),
            lonStr: toDMM(lon, false)
        };
    }

    function sortPolygonPointsClockwise(points) {
        if (points.length < 3) return points;

        let centerLat = 0, centerLon = 0;
        points.forEach(p => {
            centerLat += p.lat;
            centerLon += p.lon;
        });
        centerLat /= points.length;
        centerLon /= points.length;

        return points.slice().sort((a, b) => {
            const angleA = Math.atan2(a.lat - centerLat, a.lon - centerLon);
            const angleB = Math.atan2(b.lat - centerLat, b.lon - centerLon);
            return angleB - angleA;
        });
    }

    function checkSegmentsIntersect(p1, p2, p3, p4) {
        function ccw(a, b, c) {
            return (c.lat - a.lat) * (b.lon - a.lon) > (b.lat - a.lat) * (c.lon - a.lon);
        }
        if ((p1.lat === p3.lat && p1.lon === p3.lon) || (p1.lat === p4.lat && p1.lon === p4.lon) ||
            (p2.lat === p3.lat && p2.lon === p3.lon) || (p2.lat === p4.lat && p4.lon === p4.lon)) {
            return false;
        }
        return (ccw(p1, p3, p4) !== ccw(p2, p3, p4)) && (ccw(p1, p2, p3) !== ccw(p1, p2, p4));
    }

    function checkSelfIntersection(points) {
        if (points.length < 4) return false;
        const n = points.length;
        for (let i = 0; i < n; i++) {
            const p1 = points[i];
            const p2 = points[(i + 1) % n];
            for (let j = i + 1; j < n; j++) {
                if (Math.abs(i - j) <= 1 || Math.abs(i - j) === n - 1) continue;
                const p3 = points[j];
                const p4 = points[(j + 1) % n];
                if (checkSegmentsIntersect(p1, p2, p3, p4)) {
                    return true;
                }
            }
        }
        return false;
    }

    function parseCoordinates(text) {
        // 先移除 ICAO NOTAM 的 Q) 行：這行內含壓縮座標格式（例如 3112N12342E011，省略秒、精度較低），
        // 如果不排除，可能會被座標擷取規則誤抓成主要座標，蓋掉 E) 行裡真正精確的座標。
        const textWithoutQLine = text.replace(/^\s*Q\)[^\r\n]*(\r?\n)?/im, '');
        let cleanText = normalizeChineseCoordText(textWithoutQLine);
        cleanText = cleanText.replace(/、/g, ' ').replace(/，/g, ' ').replace(/\\/g, ' ').replace(/\//g, ' ');

        const isSectorText = text.includes("扇形") || text.includes("圓心角") || text.includes("扇形區域");
        if (isSectorText) {
            const parsedObj = parsePointsFromText(cleanText);
            const rawPoints = parsedObj.points;

            if (rawPoints.length >= 1) {
                const centerPoint = rawPoints[0];
                let startBearing = 0;
                let endBearing = 0;
                let radiusNM = 0;

                const dirMatch = text.match(/(正[東西南北](?:偏[東西南北]\s*\d+°?)?|[東西南北]偏[東西南北]\s*\d+°?)\s*(?:方向)?\s*至\s*(正[東西南北](?:偏[東西南北]\s*\d+°?)?|[東西南北]偏[東西南北]\s*\d+°?)/);
                if (dirMatch) {
                    startBearing = parseDirectionToBearing(dirMatch[1]);
                    endBearing = parseDirectionToBearing(dirMatch[2]);
                }

                if (rawPoints.length >= 2) {
                    radiusNM = parseFloat(calculateDistanceNM(centerPoint.lat, centerPoint.lon, rawPoints[1].lat, rawPoints[1].lon));
                } else {
                    const rMatch = text.match(/([\d\.]+)\s*(?:海里|海浬|nm|NM)/i);
                    if (rMatch) radiusNM = parseFloat(rMatch[1]);
                }

                if (rawPoints.length >= 3 && startBearing === endBearing) {
                    startBearing = calculateBearing(centerPoint.lat, centerPoint.lon, rawPoints[1].lat, rawPoints[1].lon);
                    endBearing = calculateBearing(centerPoint.lat, centerPoint.lon, rawPoints[2].lat, rawPoints[2].lon);
                }

                const sectorPoints = [];
                sectorPoints.push(centerPoint);

                let diff = endBearing - startBearing;
                if (diff < 0) diff += 360;

                const step = 2;
                const count = Math.floor(diff / step);

                for (let i = 0; i <= count; i++) {
                    let b = (startBearing + i * step) % 360;
                    sectorPoints.push(destinationPoint(centerPoint.lat, centerPoint.lon, radiusNM, b));
                }
                sectorPoints.push(destinationPoint(centerPoint.lat, centerPoint.lon, radiusNM, endBearing));

                return {
                    type: 'sector',
                    points: sectorPoints,
                    center: centerPoint,
                    radiusNM: radiusNM,
                    startBearing: startBearing,
                    endBearing: endBearing,
                    rawPoints: rawPoints,
                    invalidCount: parsedObj.invalidCount,
                    hasSelfIntersection: false
                };
            }
        }

        const circleRadiusMatch = text.match(/RADIUS\s+OF\s+([\d,]+(?:\.\d+)?)\s*(KM|KILOMETERS?|M|MTRS|METERS|NM)\b/i) ||
                                  text.match(/([\d,]+(?:\.\d+)?)\s*(?:海里|海浬|nm|NM)\s*(?:為|为)?\s*半(?:徑|径)/i) || 
                                  text.match(/半(?:徑|径)\s*(?:為|为)?\s*([\d,]+(?:\.\d+)?)\s*(?:海里|海浬|nm|NM)/i);

        if (circleRadiusMatch) {
            let val = parseFloat(circleRadiusMatch[1].replace(/,/g, ''));
            let unit = circleRadiusMatch[2] ? circleRadiusMatch[2].toUpperCase() : 'NM';

            let radiusNM;
            if (unit === 'KM' || unit.startsWith('KILOMETER')) {
                radiusNM = parseFloat(((val * 1000) / 1852).toFixed(2));
            } else if (unit === 'M' || unit === 'MTRS' || unit === 'METERS') {
                radiusNM = parseFloat((val / 1852).toFixed(2));
            } else {
                radiusNM = val;
            }

            const coords = parsePointsFromText(cleanText);
            if (coords.points.length >= 1) {
                return {
                    type: 'circle',
                    points: [coords.points[0]],
                    radiusNM: radiusNM,
                    invalidCount: coords.invalidCount,
                    hasSelfIntersection: false
                };
            }
        }

        const polygonResult = parsePointsFromText(cleanText);
        let originalPoints = polygonResult.points;

        // 線性禁航區判斷：文字含「航段管制/兩點連線」等中英文關鍵字，或剛好只有 2 個座標點，
        // 代表這是「兩點連成一條線」的航段管制，不是封閉面積的空域管制
        const isLineText = /航段管制|兩點連線|两点连线|LINE\s*SEGMENT|SEGMENT\s+OF\s+ATS|ATS\s*(?:RTE|ROUTE)|(?:RTE|ROUTE|AWY|AIRWAY)\s*(?:CLSD|CLOSED)|FLW\s+SEGMENT|SEGMENT.*CLSD/i.test(text);

        // 後備解析：FAA 原文常只給航路點代號（如 SADAN-MAGOD）而沒有經緯度，
        // 此時改用航路點對照表把代號換算成座標。
        let waypointInfo = null;
        if (originalPoints.length < 2) {
            waypointInfo = parseWaypointsFromText(textWithoutQLine);
            if (waypointInfo.points.length >= 2) {
                return {
                    type: 'line',
                    points: waypointInfo.points.map(p => ({ lat: p.lat, lon: p.lon })),
                    radiusNM: 0,
                    invalidCount: polygonResult.invalidCount,
                    hasSelfIntersection: false,
                    fromWaypoints: true,
                    resolvedIdents: waypointInfo.points.map(p => p.ident),
                    unresolvedIdents: waypointInfo.unresolved
                };
            }
        }

        if ((isLineText || originalPoints.length === 2) && originalPoints.length >= 2) {
            return {
                type: 'line',
                points: originalPoints,
                radiusNM: 0,
                invalidCount: polygonResult.invalidCount,
                hasSelfIntersection: false
            };
        }

        const hasSelfIntersection = checkSelfIntersection(originalPoints);

        return {
            type: 'polygon',
            points: originalPoints,
            radiusNM: 0,
            invalidCount: polygonResult.invalidCount,
            hasSelfIntersection: hasSelfIntersection,
            unresolvedIdents: waypointInfo ? waypointInfo.unresolved : []
        };
    }

    function isSamePoint(pt1, pt2) {
        return Math.abs(pt1.lat - pt2.lat) < 0.00001 && Math.abs(pt1.lon - pt2.lon) < 0.00001;
    }

    // ============================================================
    // 中國航路點 (waypoint) / 助航設施 (navaid) 代號 → 經緯度對照表
    // 對照表放在外部 waypoints-cn.json，與本檔案放在同一層目錄即可自動載入。
    // 資料來源為公開航行資料庫，僅供圖資標繪參考，非官方航行資料。
    // ============================================================
    let waypointDB = { waypoints: {}, navaids: {} };
    let waypointDBLoaded = false;

    fetch('waypoints-cn.json')
        .then(r => r.ok ? r.json() : Promise.reject(r.status))
        .then(data => {
            waypointDB = { waypoints: data.waypoints || {}, navaids: data.navaids || {} };
            waypointDBLoaded = true;
            console.log(`[航路點對照表] 已載入 ${Object.keys(waypointDB.waypoints).length} 個航路點、${Object.keys(waypointDB.navaids).length} 個助航設施`);
        })
        .catch(err => {
            console.warn('[航路點對照表] 載入失敗，航路代號將無法自動換算成經緯度：', err);
        });

    function lookupWaypoint(ident) {
        const key = String(ident).toUpperCase().trim();
        const hit = waypointDB.waypoints[key] || waypointDB.navaids[key];
        return hit ? { lat: hit[0], lon: hit[1], ident: key } : null;
    }

    // 從 FAA 原文中抽出航路點代號並換算成座標。
    // 例如「W112 : HOTAN VOR 'HTN'-ADMUX」「Y1 :SADAN-MAGOD」「L888:SADAN-BEVTA」
    // 會分別取出 HTN/ADMUX、SADAN/MAGOD、SADAN/BEVTA 這些代號去查表。
    function parseWaypointsFromText(text) {
        const resolved = [];
        const unresolved = [];
        const seen = new Set();

        // 先抓引號內的助航設施代號（如 VOR 'HTN'），再抓一般的 3-5 碼大寫代號
        const quotedIdents = [...text.matchAll(/['"]([A-Z]{2,5})['"]/g)].map(m => m[1]);
        // 航路代號本身（W112、Y1、L888、A470 等）要排除，不能當成航路點
        const routeCodePattern = /^[A-Z]{1,2}\d{1,4}$/;
        const stopWords = new Set([
            'NOTAM','NOTAMN','UTC','FLW','SEGMENT','OF','ATS','RTE','ROUTE','CLSD','CLOSED',
            'AWY','AIRWAY','AT','AND','ABOVE','BELOW','VOR','DME','NDB','VORDME','SFC','UNL',
            'GND','FL','WI','WITHIN','AREA','THE','TO','FROM','ACFT','ARE','FORBIDDEN','FLY',
            'INTO','ALL','EST','FALL','UNBURNED','DEBRIS','WILL','BE','CONDUCTED','BY','CHINA',
            'SPECIAL','OPS','FLT','ACT','TEMPORARY','DANGER','ESTABLISHED','CIRCLE','CENTERED',
            'WITH','RADIUS','VERTICAL','LIMITS','AIRCRAFT','START','BACK','ISSUE','DATE','END',
            'INTL','AP','NM','KM','SOUTHEAST','NORTHEAST','SOUTHWEST','NORTHWEST','NORTH',
            'SOUTH','EAST','WEST','MTRS','METERS','IV','BO','NBO','LIMIT',
            // 助航設施常見全名（真正要查的是引號內的代號，不是這個全名）
            'HOTAN','DUNHUANG','URUMQI','KASHGAR','LANZHOU','BEIJING','SHANGHAI','GUANGZHOU',
            // NOTAM 欄位／FIR／Q 碼等雜訊
            'ZWUQ','ZLHW','ZSHA','ZGZU','ZUGU','ZBAA','ZPPP','ZYSH','ZJSY','RPHI','QARLT',
            'QARLC','QRDCA','QRTCA','QWMLW','NOTAMR','NOTAMC','ZLDH','ZWTN'
        ]);

        const candidates = [
            ...quotedIdents,
            ...[...text.matchAll(/\b([A-Z]{3,5})\b/g)].map(m => m[1])
        ];

        candidates.forEach(ident => {
            if (seen.has(ident)) return;
            if (stopWords.has(ident)) return;
            if (routeCodePattern.test(ident)) return;
            seen.add(ident);

            const hit = lookupWaypoint(ident);
            if (hit) {
                resolved.push(hit);
            } else {
                unresolved.push(ident);
            }
        });

        return { points: resolved, unresolved };
    }

    function parsePointsFromText(cleanText) {
        let rawCoords = [];
        let invalidCount = 0;

        const pushIfValid = (lat, lon) => {
            if (lat === null || lon === null || isNaN(lat) || isNaN(lon)) return;
            if (Math.abs(lat) > 90 || Math.abs(lon) > 180) { invalidCount++; return; }
            rawCoords.push({ lat, lon });
        };

        const dmsWithDotRegex = /([NS])\s*(\d{6}(?:\.\d+)?)\s*([EW])\s*(\d{7}(?:\.\d+)?)/gi;
        let dmsDotMatch;
        let foundDmsDot = false;
        while ((dmsDotMatch = dmsWithDotRegex.exec(cleanText)) !== null) {
            foundDmsDot = true;
            const latVal = parseSingleCoordinate(dmsDotMatch[2] + dmsDotMatch[1], false);
            const lonVal = parseSingleCoordinate(dmsDotMatch[4] + dmsDotMatch[3], true);
            pushIfValid(latVal, lonVal);
        }

        if (!foundDmsDot || rawCoords.length === 0) {
            const faaDmsRegex = /\b(\d{4,6})\s*([NS])\s*(\d{5,7})\s*([EW])\b/gi;
            let faaMatch;
            let foundFaa = false;
            while ((faaMatch = faaDmsRegex.exec(cleanText)) !== null) {
                foundFaa = true;
                const latVal = parseSingleCoordinate(faaMatch[1] + faaMatch[2], false);
                const lonVal = parseSingleCoordinate(faaMatch[3] + faaMatch[4], true);
                pushIfValid(latVal, lonVal);
            }

            if (!foundFaa || rawCoords.length === 0) {
                const suffixRegex1 = /([\d°'\"\.\-\s]+[NSns])\s*[,;、\s]*\s*([\d°'\"\.\-\s]+[EWew])/g;
                let match;
                while ((match = suffixRegex1.exec(cleanText)) !== null) {
                    pushIfValid(parseSingleCoordinate(match[1], false), parseSingleCoordinate(match[2], true));
                }

                if (rawCoords.length === 0) {
                    const suffixRegex2 = /([\d°'\"\.\-\s]+[EWew])\s*[,;、\s]*\s*([\d°'\"\.\-\s]+[NSns])/g;
                    while ((match = suffixRegex2.exec(cleanText)) !== null) {
                        pushIfValid(parseSingleCoordinate(match[2], false), parseSingleCoordinate(match[1], true));
                    }
                }

                if (rawCoords.length === 0) {
                    const prefixRegex = /([NSns][\d°'\"\.\-\s]+)\s*[,;、\s]*\s*([EWew][\d°'\"\.\-\s]+)/g;
                    while ((match = prefixRegex.exec(cleanText)) !== null) {
                        pushIfValid(parseSingleCoordinate(match[1], false), parseSingleCoordinate(match[2], true));
                    }
                }

                if (rawCoords.length === 0) {
                    const decimalRegex = /(-?\d+\.\d+)\s*[,;\s]+\s*(-?\d+\.\d+)/g;
                    while ((match = decimalRegex.exec(cleanText)) !== null) {
                        pushIfValid(parseFloat(match[1]), parseFloat(match[2]));
                    }
                }
            }
        }

        const uniqueCoords = [];
        for (let i = 0; i < rawCoords.length; i++) {
            const current = rawCoords[i];
            const prev = uniqueCoords[uniqueCoords.length - 1];
            if (!prev || !isSamePoint(current, prev)) {
                uniqueCoords.push(current);
            }
        }

        if (uniqueCoords.length >= 3 && isSamePoint(uniqueCoords[0], uniqueCoords[uniqueCoords.length - 1])) {
            uniqueCoords.pop();
        }

        return { points: uniqueCoords, invalidCount };
    }

    function parseAndAdd8Hours(yearStr, monthStr, dayStr, hourStr, minStr = "00") {
        let yr = parseInt(yearStr, 10);
        if (yr < 100) yr += 2000;
        let mo = parseInt(monthStr, 10) - 1;
        let dy = parseInt(dayStr, 10);
        let hr = parseInt(hourStr, 10);
        let mn = parseInt(minStr, 10);

        let dt = new Date(Date.UTC(yr, mo, dy, hr, mn));
        dt.setUTCHours(dt.getUTCHours() + 8);

        return {
            month: dt.getUTCMonth() + 1,
            day: dt.getUTCDate(),
            hour: String(dt.getUTCHours()).padStart(2, '0') + String(dt.getUTCMinutes()).padStart(2, '0')
        };
    }

    function extractMetadata(rawText) {
        let title = "航警";
        let location = "海域";
        let timeRange = "X月X日XXXX時至X月X日XXXX時";
        let purpose = "軍事演習";

        const notamMatch = rawText.match(/([A-Z]\d{4}\/\d{2}|\b[A-Z]\d{4}\b|\b\d{4}\/\d{2}\b)/i);
        const facilityMatch = rawText.match(/\b([A-Z]{4})\b/);
        
        const titleMatch = rawText.match(/([\u4e00-\u9fa5]{1,2}航警\s*[\d\/]+)/);
        if (titleMatch) {
            title = titleMatch[1].replace(/\s+/g, '');
        } else if (notamMatch) {
            let facility = facilityMatch ? facilityMatch[1] : '';
            if (rawText.includes("FAA") || rawText.includes("NOTAM")) {
                title = `美國聯邦航空總署${notamMatch[1]}${facility ? '/' + facility : ''}`;
            } else {
                title = `國際民航組織${notamMatch[1]}${facility ? '/' + facility : ''}`;
            }
        }

        const locMatch = rawText.match(/(南海|東海|黃海|渤海|北部灣|台灣海峽|臺灣海峽|珠江口|北部湾)/);
        if (locMatch) {
            location = locMatch[1].replace('北部湾', '北部灣').replace('臺灣海峽', '台灣海峽');
        } else {
            location = "空域";
        }

        const icaoB = rawText.match(/B\)\s*(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/);
        const icaoC = rawText.match(/C\)\s*(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/);

        if (icaoB && icaoC) {
            let tStart = parseAndAdd8Hours(icaoB[1], icaoB[2], icaoB[3], icaoB[4], icaoB[5]);
            let tEnd = parseAndAdd8Hours(icaoC[1], icaoC[2], icaoC[3], icaoC[4], icaoC[5]);
            timeRange = `${tStart.month}月${tStart.day}日${tStart.hour}時至${tEnd.month}月${tEnd.day}日${tEnd.hour}時`;
        } else {
            const patternDaily = /(?:自)?\s*(\d{1,2}月\d{1,2}日)\s*(?:至|-|~|—)\s*(\d{1,2}月\d{1,2}日)\s*[,，、\s]*\s*(?:每日|每天)\s*(\d{4})\s*(?:[時时])?\s*(?:至|-|~|—)\s*(\d{4})\s*[時时]?/;
            const patternFull = /(?:自)?\s*(\d{1,2}月\d{1,2}日)\s*(\d{4})\s*(?:[時时])?\s*(?:至|-|~|—)\s*(\d{1,2}月\d{1,2}日)\s*(\d{4})\s*[時时]?/;
            const patternSingle = /(?:自)?\s*(\d{1,2}月\d{1,2}日)\s*(\d{4})\s*(?:[時时])?\s*(?:至|-|~|—)\s*(\d{4})\s*[時时]?/;

            const mDaily = rawText.match(patternDaily);
            const mFull = rawText.match(patternFull);
            const mSingle = rawText.match(patternSingle);

            if (mDaily) {
                timeRange = `${mDaily[1]}至${mDaily[2]}，每日${mDaily[3]}時至${mDaily[4]}時`;
            } else if (mFull) {
                timeRange = `${mFull[1]}${mFull[2]}時至${mFull[3]}${mFull[4]}時`;
            } else if (mSingle) {
                timeRange = `${mSingle[1]}${mSingle[2]}時至${mSingle[3]}時`;
            } else {
                const dates = rawText.match(/\d{1,2}月\d{1,2}日/g);
                const times = rawText.match(/\b\d{4}\b/g);
                const hasDaily = /每日|每天/.test(rawText);

                if (dates && dates.length >= 2 && times && times.length >= 2) {
                    timeRange = hasDaily ? `${dates[0]}至${dates[1]}，每日${times[0]}時至${times[1]}時` : `${dates[0]}${times[0]}時至${dates[1]}${times[1]}時`;
                } else if (dates && dates.length >= 1 && times && times.length >= 2) {
                    timeRange = `${dates[0]}${times[0]}時至${times[1]}時`;
                }
            }
        }

        if (rawText.includes("FIREWORK") || rawText.includes("煙火") || rawText.includes("烟花")) purpose = "煙火施放";
        else if (rawText.includes("航天發射") || rawText.includes("航天发射") || rawText.includes("SPACE LAUNCH") || rawText.includes("ROCKET")) purpose = "航天發射任務";
        else if (rawText.includes("火箭發射") || rawText.includes("火箭发射")) purpose = "火箭發射";
        else if (rawText.includes("實彈") || rawText.includes("实弹")) purpose = "實彈射擊";
        else if (rawText.includes("軍事訓練") || rawText.includes("军事训练")) purpose = "軍事訓練";
        else if (rawText.includes("軍事演習") || rawText.includes("军事演习") || rawText.includes("EXERCISE")) purpose = "軍事演習";
        else if (rawText.includes("軍事任務") || rawText.includes("军事任务")) purpose = "軍事任務";

        return { title, location, timeRange, purpose };
    }

    function buildFormattedText(area) {
        const meta = area.meta;
        const timePrefix = meta.timeRange.startsWith('自') ? '' : '自';

        if (area.type === 'circle') {
            const formatted = formatCoordString(area.points[0].lat, area.points[0].lon);
            return `${meta.title}，${meta.location}，${timePrefix}${meta.timeRange}，在以${formatted.latStr} ${formatted.lonStr}為中心，${area.radiusNM}海里為半徑的圓形區域內進行${meta.purpose}，禁止駛入。\n(初判：${meta.purpose} )`;
        } else if (area.type === 'sector') {
            const formatted = formatCoordString(area.center.lat, area.center.lon);
            return `${meta.title}，${meta.location}，${timePrefix}${meta.timeRange}，在以${formatted.latStr} ${formatted.lonStr}為圓心，半徑${area.radiusNM}海里的扇形區域內進行${meta.purpose}，禁止駛入。\n(初判：${meta.purpose} )`;
        } else if (area.type === 'line') {
            let coordLines = "";
            area.points.forEach((p, idx) => {
                const formatted = formatCoordString(p.lat, p.lon);
                coordLines += `(${idx + 1}) ${formatted.latStr} ${formatted.lonStr}\n`;
            });
            const lineDesc = area.points.length === 2 ? '兩點連線' : '諸點連線';
            return `${meta.title}，${meta.location}，${timePrefix}${meta.timeRange}，在\n${coordLines}${lineDesc}範圍進行航段管制，禁止駛入。\n(初判：${meta.purpose} )`;
        } else {
            let coordLines = "";
            area.points.forEach((p, idx) => {
                const formatted = formatCoordString(p.lat, p.lon);
                coordLines += `(${idx + 1}) ${formatted.latStr} ${formatted.lonStr}\n`;
            });
            return `${meta.title}，${meta.location}，${timePrefix}${meta.timeRange}，在\n${coordLines}諸點連線範圍進行空域管制，禁止駛入。\n(初判：${meta.purpose} )`;
        }
    }

    function computeBoundingBoxCenter(points) {
        let minLat = 90, maxLat = -90, minLon = 180, maxLon = -180;
        points.forEach(p => {
            minLat = Math.min(minLat, p.lat);
            maxLat = Math.max(maxLat, p.lat);
            minLon = Math.min(minLon, p.lon);
            maxLon = Math.max(maxLon, p.lon);
        });
        return {
            lat: (minLat + maxLat) / 2,
            lon: (minLon + maxLon) / 2
        };
    }

    // ============================================================
    // 飛行路徑生成：依禁航區資料自動擬合一條代表彈道方向的直線
    // - 2 個以上禁航區：取各禁航區中心點，做最小平方法（PCA）擬合出最佳直線
    // - 單一禁航區：改用該禁航區自己的頂點分佈，算出長軸方向（同一套算法，只是輸入點不同）
    // - 圓形禁航區沒有方向性，若只有單一圓形則無法判斷方向
    // ============================================================
    let flightPathLayer = null;

    function getAreaCenterPoint(area) {
        if (area.type === 'circle') return { lat: area.points[0].lat, lon: area.points[0].lon };
        if (area.type === 'sector') return { lat: area.center.lat, lon: area.center.lon };
        return computePolygonCentroid(area.points);
    }

    // 多邊形面積質心公式（shoelace-based centroid）：不受旋轉角度影響，
    // 傾斜的矩形／不規則多邊形也能算出精確幾何中心，跟原本用外框最大最小值算出的
    // computeBoundingBoxCenter 不同 —— 外框中心只適用於正南北/正東西方向的矩形，
    // 旋轉過的矩形用外框中心會偏移，導致飛行路徑線沒有準確穿過禁航區中心。
    function computePolygonCentroid(points) {
        const n = points.length;
        if (n < 3) return computeBoundingBoxCenter(points);

        let A = 0, cx = 0, cy = 0;
        for (let i = 0; i < n; i++) {
            const p1 = points[i];
            const p2 = points[(i + 1) % n];
            const cross = p1.lon * p2.lat - p2.lon * p1.lat;
            A += cross;
            cx += (p1.lon + p2.lon) * cross;
            cy += (p1.lat + p2.lat) * cross;
        }
        A = A / 2;

        if (Math.abs(A) < 1e-12) {
            // 退化多邊形（面積趨近於0，例如點幾乎共線），改回算術平均避免除以零
            return computeBoundingBoxCenter(points);
        }

        return { lat: cy / (6 * A), lon: cx / (6 * A) };
    }

    // 對一組經緯度點做主軸方向擬合（PCA／總體最小平方法），可處理任意角度（含接近垂直的情況）
    // 有先用該點集平均緯度的 cos 值修正經度比例尺，避免高緯度地區經度被拉伸而算錯方向
    function fitPrincipalAxis(points) {
        const n = points.length;
        const meanLat = points.reduce((s, p) => s + p.lat, 0) / n;
        const meanLon = points.reduce((s, p) => s + p.lon, 0) / n;
        const cosLat = Math.cos(meanLat * Math.PI / 180) || 1e-9;

        let sxx = 0, syy = 0, sxy = 0;
        points.forEach(p => {
            const dx = (p.lon - meanLon) * cosLat;
            const dy = (p.lat - meanLat);
            sxx += dx * dx;
            syy += dy * dy;
            sxy += dx * dy;
        });

        const theta = 0.5 * Math.atan2(2 * sxy, sxx - syy);
        let dLonProj = Math.cos(theta);
        let dLat = Math.sin(theta);
        let dLon = dLonProj / cosLat; // 換算回真實經度比例

        const norm = Math.sqrt(dLon * dLon + dLat * dLat) || 1;
        return { meanLat, meanLon, dLat: dLat / norm, dLon: dLon / norm };
    }

    // 飛行路徑延伸長度固定不變（不依賴 map.getBounds()，徹底跟目前縮放/視角脫鉤）。
    // 延伸方式沿用跟 fitPrincipalAxis 同一套經緯度平面座標系做線性外插，
    // 只有 2 個端點、單純一條直線，不會有轉折，也不會因為球面公式在長距離下失真。
    const FLIGHT_PATH_HALF_LENGTH_KM = 2500;

    function generateFlightPath() {
        if (flightPathLayer && map.hasLayer(flightPathLayer)) {
            map.removeLayer(flightPathLayer);
            flightPathLayer = null;
        }

        if (allParsedAreas.length === 0) {
            alert('請先貼上禁航區座標並點擊「一鍵繪製」，再產生飛行路徑。');
            return;
        }

        let axisPoints;
        let insurancePoints; // 一定要確實通過的點（多個禁航區=各自中心點；單一禁航區=自己的中心點）
        if (allParsedAreas.length === 1) {
            const area = allParsedAreas[0];
            if (area.type === 'circle') {
                alert('單一圓形禁航區沒有方向性，無法判斷飛行路徑方向。\n請改用矩形／多邊形禁航區，或至少提供兩個禁航區。');
                return;
            }
            axisPoints = area.points; // 用該禁航區自己的頂點分佈算長軸方向
            insurancePoints = [getAreaCenterPoint(area)]; // 保險：一定要通過這個禁航區自己的中心點
        } else {
            axisPoints = allParsedAreas.map(getAreaCenterPoint); // 用各禁航區中心點做最佳擬合直線
            insurancePoints = axisPoints; // 這裡本身就是各中心點
        }

        if (allParsedAreas.length > 2) {
            const proceed = confirm(`目前偵測到 ${allParsedAreas.length} 個禁航區資料一起參與計算方向（不是畫面上看到的數量而已）。\n如果你只想用畫面上看到的幾個禁航區來畫路徑，建議先按「全部清空」再重新貼上，避免舊資料一起被算進去。\n\n要繼續用目前全部 ${allParsedAreas.length} 個資料生成嗎？`);
            if (!proceed) return;
        }

        const { meanLat, meanLon, dLat, dLon } = fitPrincipalAxis(axisPoints);

        // 把「每單位 t 對應的實際公里數」換算出來，才能用固定公里數控制延伸長度
        const cosLat = Math.cos(meanLat * Math.PI / 180) || 1e-9;
        const kmPerUnitT = 111.32 * Math.sqrt(dLat * dLat + (dLon * cosLat) * (dLon * cosLat));
        const tMax = FLIGHT_PATH_HALF_LENGTH_KM / kmPerUnitT;

        const endA = { lat: meanLat + tMax * dLat, lon: meanLon + tMax * dLon };
        const endB = { lat: meanLat - tMax * dLat, lon: meanLon - tMax * dLon };

        // 保險做法：不只依賴「擬合直線方程式」在畫的時候會自動通過中心點，
        // 而是直接把 insurancePoints（不管單一或多個禁航區）明確插進線段頂點，
        // 依照沿著擬合方向的投影位置排序，這樣畫出來的線一定會確實經過每個禁航區的中心點。
        const projectT = (p) => (p.lat - meanLat) * dLat + (p.lon - meanLon) * dLon;
        const sortedInsurancePoints = [...insurancePoints].sort((a, b) => projectT(a) - projectT(b));

        const linePoints = [endB, ...sortedInsurancePoints, endA].map(p => [p.lat, p.lon]);

        flightPathLayer = L.polyline(
            linePoints,
            { color: '#ffe100', weight: 3, opacity: 0.9, dashArray: null }
        ).addTo(map);

        flightPathLayer.bindPopup('<button class="btn-label-del" onclick="deleteFlightPath()">🗑️ 刪除飛行路徑</button>', { closeButton: false });
    }

    function deleteFlightPath() {
        if (flightPathLayer && map.hasLayer(flightPathLayer)) {
            map.removeLayer(flightPathLayer);
        }
        flightPathLayer = null;
    }

    function computeEdgeLabelPosition(p1, p2, center) {
        const midLat = (p1.lat + p2.lat) / 2;
        const midLon = (p1.lon + p2.lon) / 2;
        
        const dx = p2.lon - p1.lon;
        const dy = p2.lat - p1.lat;
        const len = Math.sqrt(dx * dx + dy * dy) || 1;
        
        let nx = -dy / len;
        let ny = dx / len;
        
        const toCenterX = center.lon - midLon;
        const toCenterY = center.lat - midLat;
        if (nx * toCenterX + ny * toCenterY > 0) {
            nx = -nx;
            ny = -ny;
        }

        const offset = Math.min(Math.max(len * 0.15, 0.012), 0.035);

        return {
            lat: midLat + ny * offset,
            lon: midLon + nx * offset
        };
    }

    function resortAreaPoints(cardId) {
        if (!cardParsedResults[cardId]) return;
        const res = cardParsedResults[cardId];
        if (res.type === 'polygon' && res.points.length >= 3) {
            res.points = sortPolygonPointsClockwise(res.points);
            res.hasSelfIntersection = checkSelfIntersection(res.points);
            processAllData();
        }
    }

    function renderParseStatus(cardId, result, rawText) {
        const statusEl = document.getElementById(`status-${cardId}`);
        if (!statusEl) return;
        statusEl.style.display = 'block';

        if (!rawText) {
            statusEl.className = 'parse-status';
            statusEl.style.display = 'none';
            return;
        }

        if (result.type === 'circle') {
            const f = formatCoordString(result.points[0].lat, result.points[0].lon);
            statusEl.className = 'parse-status ok';
            statusEl.innerHTML = `✅ 成功解析【圓形禁航區】：<br>圓心：${f.latStr} ${f.lonStr}<br>半徑：${result.radiusNM} 海里`;
            return;
        }

        if (result.type === 'sector') {
            const f = formatCoordString(result.center.lat, result.center.lon);
            statusEl.className = 'parse-status ok';
            statusEl.innerHTML = `✅ 成功解析【扇形禁航區】：<br>圓心：${f.latStr} ${f.lonStr}<br>半徑：${result.radiusNM} 海里`;
            return;
        }

        if (result.type === 'line') {
            if (result.points.length < 2) {
                statusEl.className = 'parse-status fail';
                let msg = `⚠️ 解析失敗：線性禁航區至少需要 2 個座標點，目前只找到 ${result.points.length} 個。`;
                if (result.invalidCount > 0) msg += ` 另有 ${result.invalidCount} 個座標數值超出合理範圍，已被忽略。`;
                statusEl.innerHTML = msg;
                return;
            }
            const linePreview = result.points.map((p, i) => {
                const f = formatCoordString(p.lat, p.lon);
                const ident = (result.resolvedIdents && result.resolvedIdents[i]) ? `${result.resolvedIdents[i]}　` : '';
                return `(${i + 1}) ${ident}${f.latStr} ${f.lonStr}`;
            }).join('\n');

            let extraNote = '';
            if (result.fromWaypoints) {
                extraNote += `<div style="color:#2c5282; margin-top:4px;">🔎 由航路點代號查表換算（非官方航行資料，僅供參考）</div>`;
            }
            if (result.unresolvedIdents && result.unresolvedIdents.length > 0) {
                extraNote += `<div style="color:#b7791f; margin-top:4px;">⚠️ 對照表查無此代號，已略過：${result.unresolvedIdents.join('、')}</div>`;
            }

            statusEl.className = 'parse-status ok';
            statusEl.innerHTML = `✅ 成功解析【線性禁航區】（航段管制）：<div class="coord-preview">${linePreview}</div>${extraNote}`;
            return;
        }

        if (result.points.length < 3) {
            statusEl.className = 'parse-status fail';
            let msg = `⚠️ 解析失敗：只找到 ${result.points.length} 個有效座標點（至少需要 3 點才能構成多邊形）。`;
            if (result.invalidCount > 0) msg += ` 另有 ${result.invalidCount} 個座標數值超出合理範圍，已被忽略。`;
            statusEl.innerHTML = msg;
            return;
        }

        const preview = result.points.map((p, i) => {
            const f = formatCoordString(p.lat, p.lon);
            return `(${i + 1}) ${f.latStr} ${f.lonStr}`;
        }).join('\n');

        let warningBanner = "";
        if (result.hasSelfIntersection) {
            warningBanner = `
                <div style="color: #c53030; font-weight: bold; margin-bottom: 4px;">
                    ⚠️ 警告：偵測到點位連接線段交叉！
                </div>
                <button class="btn-resort" onclick="resortAreaPoints('${cardId}')">🔄 嘗試順序重排</button>
            `;
        }

        if (result.invalidCount > 0 || result.hasSelfIntersection) {
            statusEl.className = 'parse-status warn';
            statusEl.innerHTML = `${warningBanner}⚠️ 成功解析 ${result.points.length} 點：<div class="coord-preview">${preview}</div>`;
        } else {
            statusEl.className = 'parse-status ok';
            statusEl.innerHTML = `${warningBanner}✅ 成功解析 ${result.points.length} 點多邊形：<div class="coord-preview">${preview}</div>`;
        }
    }

    function processAllData() {
        deselectCurrentLabel();
        Object.keys(areaMapObjects).forEach(cardId => removeAreaFromMap(cardId));
        areaMapObjects = {};
        allParsedAreas = [];
        if (flightPathLayer && map.hasLayer(flightPathLayer)) {
            map.removeLayer(flightPathLayer);
            flightPathLayer = null;
        }

        const cards = document.querySelectorAll('.area-card');
        let featureGroup = L.featureGroup();

        cards.forEach((card) => {
            const cardId = card.id;
            const num = card.dataset.num;
            const text = card.querySelector('.area-input').value.trim();
            
            let result;
            if (cardParsedResults[cardId] && cardParsedResults[cardId].rawText === text) {
                result = cardParsedResults[cardId];
            } else {
                result = parseCoordinates(text);
                result.rawText = text;
                cardParsedResults[cardId] = result;
            }

            renderParseStatus(cardId, result, text);

            if (!text) return;
            if (result.type === 'polygon' && result.points.length < 3) return;
            if (result.type === 'circle' && result.points.length < 1) return;
            if (result.type === 'sector' && result.points.length < 3) return;
            if (result.type === 'line' && result.points.length < 2) return;

            const meta = extractMetadata(text);
            const areaData = { cardId, num, text, type: result.type, points: result.points, center: result.center, radiusNM: result.radiusNM, meta };
            allParsedAreas.push(areaData);

            let shapeLayer = null;
            let currentLabels = [];

            if (result.type === 'circle') {
                const radiusMeters = result.radiusNM * 1852;
                shapeLayer = L.circle([result.points[0].lat, result.points[0].lon], {
                    radius: radiusMeters,
                    color: 'red',
                    weight: 3,
                    fillColor: 'red',
                    fillOpacity: 0.4
                }).addTo(map);

                featureGroup.addLayer(shapeLayer);

                const latOffset = (result.radiusNM / 60) * 1.05;
                const marker = createLabelMarker(
                    result.points[0].lat + latOffset, 
                    result.points[0].lon, 
                    `${result.radiusNM}浬 (半徑)`, 
                    [80, 20], 
                    [40, 10]
                );
                currentLabels.push(marker);
                if (showLabels) marker.addTo(map);

            } else if (result.type === 'line') {
                const latLngs = result.points.map(p => [p.lat, p.lon]);
                shapeLayer = L.polyline(latLngs, {
                    color: 'red',
                    weight: 3
                }).addTo(map);

                featureGroup.addLayer(shapeLayer);

                for (let i = 0; i < result.points.length - 1; i++) {
                    const p1 = result.points[i];
                    const p2 = result.points[i + 1];
                    const dist = calculateDistanceNM(p1.lat, p1.lon, p2.lat, p2.lon);
                    const midLat = (p1.lat + p2.lat) / 2;
                    const midLon = (p1.lon + p2.lon) / 2;

                    const marker = createLabelMarker(
                        midLat,
                        midLon,
                        `${dist}浬`,
                        [42, 20],
                        [21, 10]
                    );
                    currentLabels.push(marker);
                    if (showLabels) marker.addTo(map);
                }

            } else {
                const latLngs = result.points.map(p => [p.lat, p.lon]);
                shapeLayer = L.polygon(latLngs, {
                    color: 'red',
                    weight: 3,
                    fillColor: 'red',
                    fillOpacity: 0.4
                }).addTo(map);

                featureGroup.addLayer(shapeLayer);

                if (result.type === 'sector') {
                    const labelPos = destinationPoint(result.center.lat, result.center.lon, result.radiusNM * 0.5, (result.startBearing + result.endBearing) / 2);
                    const marker = createLabelMarker(
                        labelPos.lat, 
                        labelPos.lon, 
                        `${result.radiusNM}浬 (半徑)`, 
                        [80, 20], 
                        [40, 10]
                    );
                    currentLabels.push(marker);
                    if (showLabels) marker.addTo(map);
                } else {
                    const bboxCenter = computeBoundingBoxCenter(result.points);

                    for (let i = 0; i < result.points.length; i++) {
                        const p1 = result.points[i];
                        const p2 = result.points[(i + 1) % result.points.length];
                        const dist = calculateDistanceNM(p1.lat, p1.lon, p2.lat, p2.lon);
                        const labelPos = computeEdgeLabelPosition(p1, p2, bboxCenter);

                        const marker = createLabelMarker(
                            labelPos.lat, 
                            labelPos.lon, 
                            `${dist}浬`, 
                            [42, 20], 
                            [21, 10]
                        );
                        currentLabels.push(marker);
                        if (showLabels) marker.addTo(map);
                    }
                }
            }

            // 滑鼠移到禁航區框框上時顯示「禁航區 #N」，移開自動消失（Leaflet tooltip 內建行為）
            shapeLayer.bindTooltip(`禁航區 #${num}`, {
                sticky: true,
                direction: 'top',
                className: 'area-hover-tooltip'
            });

            areaMapObjects[cardId] = { shape: shapeLayer, labels: currentLabels, visible: true };

            const visBtn = document.getElementById(`btn-vis-${cardId}`);
            if (visBtn) {
                visBtn.innerText = '👁 顯示';
                visBtn.classList.remove('hidden-state');
            }
        });

        if (allParsedAreas.length === 0) {
            alert('沒有解析到任何有效的禁航區座標！請查看各區塊下方的解析狀態提示。');
            document.getElementById('output-section').style.display = 'none';
            return;
        }

        map.fitBounds(featureGroup.getBounds(), { padding: [50, 50] });

        setTimeout(() => {
            map.invalidateSize();
        }, 200);

        renderAreaOutputs();
        document.getElementById('output-section').style.display = 'block';
    }

    function clearAllData() {
        deselectCurrentLabel();
        Object.keys(areaMapObjects).forEach(cardId => removeAreaFromMap(cardId));
        areaMapObjects = {};
        allParsedAreas = [];
        cardParsedResults = {};
        if (flightPathLayer && map.hasLayer(flightPathLayer)) {
            map.removeLayer(flightPathLayer);
            flightPathLayer = null;
        }

        const inputs = document.querySelectorAll('.area-input');
        inputs.forEach(input => input.value = '');

        const statusEls = document.querySelectorAll('.parse-status');
        statusEls.forEach(el => {
            el.style.display = 'none';
            el.innerHTML = '';
        });

        document.getElementById('output-section').style.display = 'none';
        document.getElementById('areaOutputContainer').innerHTML = '';
    }

    function renderAreaOutputs() {
        const container = document.getElementById('areaOutputContainer');
        container.innerHTML = '';

        allParsedAreas.forEach((area) => {
            const blockId = `output-${area.cardId}`;
            let titleDesc = `多邊形 (${area.points.length} 點)`;
            if (area.type === 'circle') titleDesc = `圓形 (半徑 ${area.radiusNM} 浬)`;
            if (area.type === 'sector') titleDesc = `扇形 (半徑 ${area.radiusNM} 浬)`;
            if (area.type === 'line') titleDesc = `線段 (航段管制，${area.points.length} 點)`;

            const html = `
                <div class="area-output" id="${blockId}" data-card-id="${area.cardId}">
                    <div class="area-output-header">
                        <span>【區域 #${area.num}】${titleDesc}</span>
                        <button class="btn-copy-single" onclick="copySingleText('${area.cardId}')">📋 複製本區文字</button>
                    </div>
                    <div class="meta-edit">
                        <label>標題
                            <input type="text" data-field="title" value="${escapeAttr(area.meta.title)}" oninput="updateAreaMeta('${area.cardId}', this)">
                        </label>
                        <label>海域
                            <input type="text" data-field="location" value="${escapeAttr(area.meta.location)}" oninput="updateAreaMeta('${area.cardId}', this)">
                        </label>
                        <label style="grid-column: span 2;">時間
                            <input type="text" data-field="timeRange" value="${escapeAttr(area.meta.timeRange)}" oninput="updateAreaMeta('${area.cardId}', this)">
                        </label>
                        <label style="grid-column: span 2;">性質
                            <input type="text" data-field="purpose" value="${escapeAttr(area.meta.purpose)}" oninput="updateAreaMeta('${area.cardId}', this)">
                        </label>
                    </div>
                    <div class="formatted-text-single" id="text-${area.cardId}"></div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
            document.getElementById(`text-${area.cardId}`).innerText = buildFormattedText(area);
        });
    }

    function copySingleText(cardId) {
        const textEl = document.getElementById(`text-${cardId}`);
        if (!textEl) return;
        navigator.clipboard.writeText(textEl.innerText).then(() => {
            alert('已複製該區域 PPT 文字內容！');
        }).catch(err => {
            alert('複製失敗：' + err);
        });
    }

    function escapeAttr(str) {
        return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function updateAreaMeta(cardId, inputEl) {
        const area = allParsedAreas.find(a => a.cardId === cardId);
        if (!area) return;
        const field = inputEl.dataset.field;
        area.meta[field] = inputEl.value;
        const textEl = document.getElementById(`text-${cardId}`);
        if (textEl) textEl.innerText = buildFormattedText(area);
    }

    function toggleLabelVisibility() {
        showLabels = document.getElementById('toggleLabels').checked;
        Object.keys(areaMapObjects).forEach(cardId => {
            const obj = areaMapObjects[cardId];
            if (obj.visible) {
                obj.labels.forEach(m => {
                    if (showLabels) {
                        if (!map.hasLayer(m)) m.addTo(map);
                    } else {
                        if (map.hasLayer(m)) map.removeLayer(m);
                    }
                });
            }
        });
    }

    function generateCircleKMLCoords(centerLat, centerLon, radiusNM, numPoints = 64) {
        const coords = [];
        for (let i = 0; i <= numPoints; i++) {
            const bearing = (i * 360 / numPoints);
            const pt = destinationPoint(centerLat, centerLon, radiusNM, bearing);
            coords.push(`${pt.lon.toFixed(6)},${pt.lat.toFixed(6)},0`);
        }
        return coords.join('\n');
    }

    function downloadKML() {
        if (allParsedAreas.length === 0) {
            alert('請先點擊「一鍵繪製」！');
            return;
        }

        let kmlFolders = "";

        allParsedAreas.forEach((area) => {
            let kmlCoords = "";

            if (area.type === 'circle') {
                kmlCoords = generateCircleKMLCoords(area.points[0].lat, area.points[0].lon, area.radiusNM);
            } else if (area.type === 'line') {
                kmlCoords = area.points.map(p => `${p.lon},${p.lat},0`).join('\n');
            } else {
                kmlCoords = area.points.map(p => `${p.lon},${p.lat},0`).join('\n');
                kmlCoords += `\n${area.points[0].lon},${area.points[0].lat},0`;
            }

            const geometryXml = area.type === 'line' ? `
      <LineString>
        <coordinates>
${kmlCoords}
        </coordinates>
      </LineString>` : `
      <Polygon>
        <outerBoundaryIs>
          <LinearRing>
            <coordinates>
${kmlCoords}
            </coordinates>
          </LinearRing>
        </outerBoundaryIs>
      </Polygon>`;

            let placemarks = `
    <Placemark>
      <name>禁航區 #${area.num} (${area.type})</name>
      <description><![CDATA[${buildFormattedText(area).replace(/\n/g, '<br>')}]]></description>
      <styleUrl>#redAreaStyle</styleUrl>${geometryXml}
    </Placemark>`;

            kmlFolders += `
    <Folder>
      <name>禁航區 #${area.num}</name>
      ${placemarks}
    </Folder>`;
        });

        const kmlContent = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>禁航區圖資</name>
    <Style id="redAreaStyle">
      <LineStyle><color>ff0000ff</color><width>3</width></LineStyle>
      <PolyStyle><color>800000ff</color></PolyStyle>
    </Style>
    ${kmlFolders}
  </Document>
</kml>`;

        const blob = new Blob([kmlContent], { type: 'application/vnd.google-earth.kml+xml' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = '禁航區圖資.kml';
        link.click();
    }

    // ============================================================
    // 匯出選單開關（禁航區資料 vs 測量與標記圖資）
    // ============================================================
    function toggleKmlExportMenu(evt) {
        const menu = document.getElementById('kmlExportMenu');
        const btn = evt.currentTarget;
        const btnRect = btn.getBoundingClientRect();
        const rowRect = btn.parentElement.getBoundingClientRect();
        menu.style.top = (btnRect.bottom - rowRect.top + 4) + 'px';
        menu.style.left = '0px';
        menu.classList.toggle('show');
    }
    function closeKmlExportMenu() {
        document.getElementById('kmlExportMenu').classList.remove('show');
    }
    document.addEventListener('click', function (e) {
        const menu = document.getElementById('kmlExportMenu');
        if (!menu) return;
        if (menu.classList.contains('show') && !menu.contains(e.target) && e.target.closest('.btn-kml') === null) {
            menu.classList.remove('show');
        }
    });

    // ============================================================
    // 測量與標記圖資 —— KML 匯出（線／圓／矩形／點位）
    // 使用標準幾何（LineString / Polygon / Point）確保能被 Google Earth 等軟體開啟，
    // 另外用 <ExtendedData> 附加精確資料（圓心+半徑、矩形四界、點位名稱/顯示狀態），
    // 供本工具「匯入」時完整還原，不受標準幾何近似值影響。
    // ============================================================
    function exportDrawnFeaturesKML() {
        const totalCount = drawnFeatures.lines.length + drawnFeatures.circles.length +
                            drawnFeatures.rectangles.length + drawnFeatures.points.length;
        if (totalCount === 0) {
            alert('目前沒有任何測量線條、圓形、矩形或標記點位可以匯出。');
            return;
        }

        let placemarks = '';

        drawnFeatures.lines.forEach((f, i) => {
            const coords = f.latlngs.map(p => `${p.lon},${p.lat},0`).join('\n            ');
            placemarks += `
    <Placemark>
      <name>測量線 #${i + 1}（${f.nm.toFixed(2)} 浬 / ${f.km.toFixed(2)} km）</name>
      <ExtendedData>
        <Data name="featureType"><value>line</value></Data>
        <Data name="distanceKm"><value>${f.km.toFixed(3)}</value></Data>
        <Data name="distanceNm"><value>${f.nm.toFixed(3)}</value></Data>
      </ExtendedData>
      <LineString>
        <coordinates>
            ${coords}
        </coordinates>
      </LineString>
    </Placemark>`;
        });

        drawnFeatures.circles.forEach((f, i) => {
            const coords = generateCircleKMLCoords(f.center.lat, f.center.lon, f.radiusNm);
            placemarks += `
    <Placemark>
      <name>圓形 #${i + 1}（半徑 ${f.radiusNm.toFixed(2)} 浬）</name>
      <ExtendedData>
        <Data name="featureType"><value>circle</value></Data>
        <Data name="centerLat"><value>${f.center.lat}</value></Data>
        <Data name="centerLon"><value>${f.center.lon}</value></Data>
        <Data name="radiusNm"><value>${f.radiusNm}</value></Data>
      </ExtendedData>
      <Polygon>
        <outerBoundaryIs>
          <LinearRing>
            <coordinates>
${coords}
            </coordinates>
          </LinearRing>
        </outerBoundaryIs>
      </Polygon>
    </Placemark>`;
        });

        drawnFeatures.rectangles.forEach((f, i) => {
            const b = f.bounds;
            const coords = [
                `${b.west},${b.north},0`, `${b.east},${b.north},0`,
                `${b.east},${b.south},0`, `${b.west},${b.south},0`, `${b.west},${b.north},0`
            ].join('\n            ');
            placemarks += `
    <Placemark>
      <name>矩形 #${i + 1}</name>
      <ExtendedData>
        <Data name="featureType"><value>rectangle</value></Data>
        <Data name="north"><value>${b.north}</value></Data>
        <Data name="south"><value>${b.south}</value></Data>
        <Data name="east"><value>${b.east}</value></Data>
        <Data name="west"><value>${b.west}</value></Data>
      </ExtendedData>
      <Polygon>
        <outerBoundaryIs>
          <LinearRing>
            <coordinates>
            ${coords}
            </coordinates>
          </LinearRing>
        </outerBoundaryIs>
      </Polygon>
    </Placemark>`;
        });

        drawnFeatures.points.forEach((f) => {
            placemarks += `
    <Placemark>
      <name>${escapeXml(f.name)}</name>
      <ExtendedData>
        <Data name="featureType"><value>point</value></Data>
        <Data name="labelVisible"><value>${f.visible ? '1' : '0'}</value></Data>
      </ExtendedData>
      <Point>
        <coordinates>${f.lon},${f.lat},0</coordinates>
      </Point>
    </Placemark>`;
        });

        const kmlContent = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>測量與標記圖資</name>
    <Style id="drawnLineStyle">
      <LineStyle><color>ff2067dd</color><width>3</width></LineStyle>
      <PolyStyle><color>1a2067dd</color></PolyStyle>
    </Style>
    <Folder>
      <name>測量與標記圖資</name>
      ${placemarks}
    </Folder>
  </Document>
</kml>`;

        const blob = new Blob([kmlContent], { type: 'application/vnd.google-earth.kml+xml' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = '測量標記圖資.kml';
        link.click();
    }

    function escapeXml(str) {
        return String(str).replace(/[<>&'"]/g, c => ({ '<':'&lt;','>':'&gt;','&':'&amp;',"'":'&apos;','"':'&quot;' }[c]));
    }

    // ============================================================
    // 測量與標記圖資 —— KML 匯入
    // 優先讀取 <ExtendedData> 內的 featureType 還原精確圖形；
    // 若匯入的是本工具以外產生、沒有 ExtendedData 的一般 KML，
    // 則退回以幾何型態（Point/LineString/Polygon）做通用判斷匯入。
    // ============================================================
    function handleKmlImport(evt) {
        const file = evt.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (e) {
            try {
                parseAndImportKML(e.target.result);
            } catch (err) {
                alert('KML 檔案解析失敗，請確認檔案格式是否正確。\n' + err.message);
            }
            evt.target.value = '';
        };
        reader.readAsText(file, 'UTF-8');
    }

    function getExtendedData(placemarkEl) {
        const data = {};
        placemarkEl.querySelectorAll('ExtendedData Data').forEach(dataEl => {
            const name = dataEl.getAttribute('name');
            const valueEl = dataEl.querySelector('value');
            if (name && valueEl) data[name] = valueEl.textContent;
        });
        return data;
    }

    function parseAndImportKML(kmlText) {
        const parser = new DOMParser();
        const xml = parser.parseFromString(kmlText, 'text/xml');
        if (xml.querySelector('parsererror')) {
            throw new Error('XML 格式錯誤');
        }
        const placemarks = xml.querySelectorAll('Placemark');
        if (placemarks.length === 0) {
            alert('這個 KML 檔案裡沒有找到任何可匯入的圖徵。');
            return;
        }

        let imported = 0;

        placemarks.forEach(pm => {
            const ext = getExtendedData(pm);
            const nameEl = pm.querySelector('name');
            const placemarkName = nameEl ? nameEl.textContent : '';

            if (ext.featureType === 'circle' && ext.centerLat && ext.centerLon && ext.radiusNm) {
                const center = L.latLng(parseFloat(ext.centerLat), parseFloat(ext.centerLon));
                const radiusM = parseFloat(ext.radiusNm) * 1852;
                const layer = L.circle(center, { radius: radiusM });
                registerCircle(layer);
                imported++;
                return;
            }

            if (ext.featureType === 'rectangle' && ext.north && ext.south && ext.east && ext.west) {
                const bounds = L.latLngBounds(
                    [parseFloat(ext.south), parseFloat(ext.west)],
                    [parseFloat(ext.north), parseFloat(ext.east)]
                );
                const layer = L.rectangle(bounds);
                registerRectangle(layer);
                imported++;
                return;
            }

            if (ext.featureType === 'line') {
                const lineEl = pm.querySelector('LineString coordinates');
                if (lineEl) {
                    const latlngs = parseKmlCoordText(lineEl.textContent);
                    const layer = L.polyline(latlngs);
                    registerLine(layer);
                    imported++;
                    return;
                }
            }

            if (ext.featureType === 'point') {
                const pointEl = pm.querySelector('Point coordinates');
                if (pointEl) {
                    const latlngs = parseKmlCoordText(pointEl.textContent);
                    if (latlngs[0]) {
                        promptAndRegisterPoint(latlngs[0], placemarkName || '未命名點位', ext.labelVisible !== '0');
                        imported++;
                    }
                    return;
                }
            }

            // --- 沒有 ExtendedData（非本工具產生）的通用退回解析 ---
            const genPoint = pm.querySelector('Point coordinates');
            if (genPoint) {
                const latlngs = parseKmlCoordText(genPoint.textContent);
                if (latlngs[0]) {
                    promptAndRegisterPoint(latlngs[0], placemarkName || '未命名點位', true);
                    imported++;
                }
                return;
            }
            const genLine = pm.querySelector('LineString coordinates');
            if (genLine) {
                const latlngs = parseKmlCoordText(genLine.textContent);
                if (latlngs.length >= 2) {
                    const layer = L.polyline(latlngs);
                    registerLine(layer);
                    imported++;
                }
                return;
            }
            const genPoly = pm.querySelector('Polygon coordinates');
            if (genPoly) {
                const latlngs = parseKmlCoordText(genPoly.textContent);
                if (latlngs.length >= 3) {
                    const layer = L.rectangle(L.latLngBounds(latlngs));
                    registerRectangle(layer);
                    imported++;
                }
                return;
            }
        });

        if (imported > 0) {
            alert(`✅ 已成功匯入 ${imported} 筆測量／標記圖徵。`);
        } else {
            alert('沒有可辨識的圖徵可以匯入。');
        }
    }

    function parseKmlCoordText(text) {
        return text.trim().split(/\s+/).filter(Boolean).map(tuple => {
            const parts = tuple.split(',');
            const lon = parseFloat(parts[0]);
            const lat = parseFloat(parts[1]);
            return L.latLng(lat, lon);
        });
    }
</script>

</body>
</html>
