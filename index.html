<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>禁航區繪製小工具</title>
    <!-- Leaflet 地圖套件 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Microsoft JhengHei", Arial, sans-serif; display: flex; height: 100vh; background: #f0f2f5; overflow: hidden; }

        /* 側邊欄與收折過渡效果 */
        #sidebar {
            width: 440px;
            padding: 20px;
            background: #ffffff;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 1000;
            overflow-y: auto;
            transition: margin-left 0.3s ease;
            position: relative;
            flex-shrink: 0;
        }

        #sidebar.collapsed {
            margin-left: -440px;
        }

        /* 浮動收折按鈕 */
        #toggle-sidebar-btn {
            position: absolute;
            top: 15px;
            left: 450px;
            z-index: 1100;
            background: #1a365d;
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            transition: left 0.3s ease, background 0.2s;
        }

        #toggle-sidebar-btn:hover { background: #2b6cb0; }
        #toggle-sidebar-btn.collapsed { left: 10px; }

        #map { flex: 1; height: 100%; position: relative; }
        h2 { font-size: 18px; color: #1a365d; border-bottom: 2px solid #3182ce; padding-bottom: 6px; }

        .area-card { background: #f8fafc; border: 1px solid #cbd5e0; border-radius: 8px; padding: 12px; margin-bottom: 8px; position: relative; }
        .area-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .area-title { font-weight: bold; color: #2d3748; font-size: 14px; }
        
        .header-actions { display: flex; gap: 6px; align-items: center; }
        
        .btn-vis { background: #4a5568; color: white; border: none; padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-vis:hover { background: #2d3748; }
        .btn-vis.hidden-state { background: #a0aec0; color: #2d3748; }

        .btn-del { background: #e53e3e; color: white; border: none; padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-del:hover { background: #c53030; }

        textarea { width: 100%; height: 110px; padding: 8px; font-size: 13px; border: 1px solid #cbd5e0; border-radius: 6px; resize: vertical; line-height: 1.4; font-family: monospace; }

        .control-panel { background: #edf2f7; padding: 10px 12px; border-radius: 6px; font-size: 13px; display: flex; flex-direction: column; gap: 8px; }
        .switch-label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: bold; color: #2d3748; }

        .btn-group { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 4px; }
        .btn-row { display: flex; gap: 8px; width: 100%; }

        button { 
            padding: 10px; 
            font-size: 13px; 
            font-weight: bold; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            white-space: nowrap; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-add { background: #edf2f7; color: #2d3748; border: 1px dashed #cbd5e0; width: 100%; }
        .btn-add:hover { background: #e2e8f0; border-color: #a0aec0; }

        .btn-parse { background: #3182ce; width: 100%; padding: 12px; font-size: 14px; box-shadow: 0 2px 4px rgba(49, 130, 206, 0.3); }
        .btn-parse:hover { background: #2b6cb0; transform: translateY(-1px); box-shadow: 0 4px 6px rgba(49, 130, 206, 0.4); }

        .btn-kml { background: #38a169; flex: 2; padding: 10px; }
        .btn-kml:hover { background: #2f855a; }

        .btn-clear { background: #e2e8f0; color: #4a5568; flex: 1; padding: 10px; }
        .btn-clear:hover { background: #cbd5e0; color: #2d3748; }

        .parse-status { margin-top: 8px; padding: 6px 8px; border-radius: 4px; font-size: 12px; line-height: 1.5; }
        .parse-status.ok { background: #f0fff4; border: 1px solid #9ae6b4; color: #22543d; }
        .parse-status.warn { background: #fffaf0; border: 1px solid #fbd38d; color: #7b341e; }
        .parse-status.fail { background: #fff5f5; border: 1px solid #feb2b2; color: #822727; }
        .parse-status .coord-preview { font-family: monospace; margin-top: 4px; color: #4a5568; white-space: pre-wrap; }

        #output-section { display: none; background: #f7fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 6px; font-size: 13px; }
        #areaOutputContainer { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
        .area-output { background: #ffffff; border: 1px solid #cbd5e0; border-radius: 6px; padding: 10px; }
        .area-output-header { font-weight: bold; color: #2d3748; font-size: 13px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }

        .btn-copy-single { background: #edf2f7; color: #2b6cb0; border: 1px solid #cbd5e0; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .btn-copy-single:hover { background: #e2e8f0; color: #2c5282; }

        .meta-edit { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
        .meta-edit label { font-size: 11px; color: #4a5568; display: flex; flex-direction: column; gap: 2px; }
        .meta-edit input { font-size: 12px; padding: 5px 6px; border: 1px solid #cbd5e0; border-radius: 4px; font-family: "Microsoft JhengHei", monospace; }
        .meta-edit input:focus { outline: none; border-color: #3182ce; box-shadow: 0 0 0 1px #3182ce; }

        .formatted-text-single { background: #f7fafc; border: 1px solid #e2e8f0; padding: 8px; border-radius: 4px; white-space: pre-wrap; font-family: "Microsoft JhengHei", monospace; color: #1a202c; line-height: 1.5; font-size: 12px; max-height: 200px; overflow-y: auto; }

        .dist-label {
            background: rgba(0, 0, 0, 0.9);
            color: #ffff00;
            font-weight: bold;
            font-size: 13px;
            padding: 2px 6px;
            border-radius: 3px;
            border: none;
            white-space: nowrap;
            text-align: center;
            box-shadow: 1px 1px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

<button id="toggle-sidebar-btn" onclick="toggleSidebar()" title="隱藏/展開控制面板">◀</button>

<div id="sidebar">
    <h2>禁航區繪製小工具</h2>

    <div class="control-panel">
        <label class="switch-label">
            <input type="checkbox" id="toggleLabels" checked onchange="toggleLabelVisibility()"> 顯示海浬標籤
        </label>
        <label class="switch-label">
            <input type="checkbox" id="toggleMapPlaces" checked onchange="toggleMapPlacesVisibility()"> 顯示地名 / 道路
        </label>
    </div>

    <div id="areaContainer"></div>

    <button class="btn-add" onclick="addAreaCard()">＋ 新增禁航區</button>

    <div class="btn-group">
        <button class="btn-parse" onclick="processAllData()">
            <span>一鍵繪製</span>
        </button>
        <div class="btn-row">
            <button class="btn-kml" onclick="downloadKML()">匯出全部 KML</button>
            <button class="btn-clear" onclick="clearAllData()">全部清空</button>
        </div>
    </div>

    <div id="output-section">
        <strong>PPT 後製專用文字格式：</strong>
        <div id="areaOutputContainer"></div>
    </div>
</div>

<div id="map"></div>

<script>
    const map = L.map('map', { zoomControl: false }).setView([21.5, 112.0], 7);
    L.control.zoom({ position: 'topright' }).addTo(map);

    const googleSatLayer = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
        attribution: '&copy; Google Maps'
    }).addTo(map);

    const googlePlacesLayer = L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
        attribution: '&copy; Google Maps'
    }).addTo(map);

    let cardCount = 0;
    let areaMapObjects = {}; // 儲存各區域對應的圖層與標籤
    let allParsedAreas = []; 
    let showLabels = true;

    window.onload = function() {
        addAreaCard();
    };

    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const btn = document.getElementById('toggle-sidebar-btn');
        sidebar.classList.toggle('collapsed');
        btn.classList.toggle('collapsed');
        btn.innerText = sidebar.classList.contains('collapsed') ? '▶' : '◀';
        setTimeout(() => { map.invalidateSize(); }, 300);
    }

    function toggleMapPlacesVisibility() {
        const isChecked = document.getElementById('toggleMapPlaces').checked;
        if (isChecked) {
            if (!map.hasLayer(googlePlacesLayer)) map.addLayer(googlePlacesLayer);
        } else {
            if (map.hasLayer(googlePlacesLayer)) map.removeLayer(googlePlacesLayer);
        }
    }

    function addAreaCard() {
        cardCount++;
        const cardId = `area-card-${cardCount}`;
        const container = document.getElementById('areaContainer');

        const cardHTML = `
            <div class="area-card" id="${cardId}" data-num="${cardCount}">
                <div class="area-header">
                    <span class="area-title">禁航區 #${cardCount}</span>
                    <div class="header-actions">
                        <button class="btn-vis" id="btn-vis-${cardId}" onclick="toggleAreaVisibility('${cardId}')">👁 顯示</button>
                        ${cardCount > 1 ? `<button class="btn-del" onclick="removeAreaCard('${cardId}')">刪除</button>` : ''}
                    </div>
                </div>
                <textarea class="area-input" placeholder="請貼入航警原始文字..."></textarea>
                <div class="parse-status" id="status-${cardId}" style="display:none;"></div>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', cardHTML);
    }

    function removeAreaCard(cardId) {
        const card = document.getElementById(cardId);
        if (card) card.remove();
        if (areaMapObjects[cardId]) {
            removeAreaFromMap(cardId);
            delete areaMapObjects[cardId];
        }
    }

    function toggleAreaVisibility(cardId) {
        const btn = document.getElementById(`btn-vis-${cardId}`);
        const obj = areaMapObjects[cardId];
        if (!obj) return;

        obj.visible = !obj.visible;

        if (obj.visible) {
            if (obj.shape && !map.hasLayer(obj.shape)) map.addLayer(obj.shape);
            if (showLabels) {
                obj.labels.forEach(m => { if (!map.hasLayer(m)) map.addLayer(m); });
            }
            btn.innerText = '👁 顯示';
            btn.classList.remove('hidden-state');
        } else {
            if (obj.shape && map.hasLayer(obj.shape)) map.removeLayer(obj.shape);
            obj.labels.forEach(m => { if (map.hasLayer(m)) map.removeLayer(m); });
            btn.innerText = '🙈 隱藏';
            btn.classList.add('hidden-state');
        }
    }

    function removeAreaFromMap(cardId) {
        if (areaMapObjects[cardId]) {
            const obj = areaMapObjects[cardId];
            if (obj.shape && map.hasLayer(obj.shape)) map.removeLayer(obj.shape);
            obj.labels.forEach(m => { if (map.hasLayer(m)) map.removeLayer(m); });
        }
    }

    function calculateDistanceNM(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return (R * c * 0.539957).toFixed(0);
    }

    function normalizeChineseCoordText(text) {
        return text
            .replace(/北緯|北纬/g, ' N')
            .replace(/南緯|南纬/g, ' S')
            .replace(/東經|东经/g, ' E')
            .replace(/西經|西经/g, ' W')
            .replace(/[度分秒]/g, ' ');
    }

    function parseSingleCoordinate(str, isLongitude) {
        if (!str) return null;
        str = str.trim().toUpperCase();

        let dir = null;
        if (str.includes('N') || str.includes('S') || str.includes('E') || str.includes('W')) {
            dir = str.match(/[NSEW]/)[0];
            str = str.replace(/[NSEW]/g, '');
        }

        str = str.replace(/[°'"]\s*/g, ' ').replace(/[-–]/g, ' ').trim();
        const parts = str.split(/\s+/).map(Number).filter(n => !isNaN(n));

        let val = 0;
        if (parts.length === 1) {
            let numStr = parts[0].toString();
            if (numStr.includes('.')) {
                let degLen = isLongitude ? (numStr.indexOf('.') === 5 ? 3 : 2) : (numStr.indexOf('.') === 4 ? 2 : 2);
                if (numStr.indexOf('.') > 3) {
                    let d = parseFloat(numStr.substring(0, degLen));
                    let m = parseFloat(numStr.substring(degLen));
                    val = d + m / 60.0;
                } else {
                    val = parts[0];
                }
            } else {
                if (numStr.length >= 6) {
                    let d = parseFloat(numStr.substring(0, numStr.length - 4));
                    let m = parseFloat(numStr.substring(numStr.length - 4, numStr.length - 2));
                    let s = parseFloat(numStr.substring(numStr.length - 2));
                    val = d + m / 60.0 + s / 3600.0;
                } else if (numStr.length >= 4) {
                    let d = parseFloat(numStr.substring(0, numStr.length - 2));
                    let m = parseFloat(numStr.substring(numStr.length - 2));
                    val = d + m / 60.0;
                } else {
                    val = parts[0];
                }
            }
        } else if (parts.length === 2) {
            val = parts[0] + parts[1] / 60.0;
        } else if (parts.length >= 3) {
            val = parts[0] + parts[1] / 60.0 + parts[2] / 3600.0;
        }

        if (dir === 'S' || dir === 'W') val = -val;
        return val;
    }

    function formatCoordString(lat, lon) {
        function toDMM(val, isLat) {
            const absVal = Math.abs(val);
            const deg = Math.floor(absVal);
            const min = ((absVal - deg) * 60).toFixed(2);
            const minStr = min < 10 ? '0' + min : min;
            const dir = isLat ? (val >= 0 ? 'N' : 'S') : (val >= 0 ? 'E' : 'W');
            return `${deg}-${minStr}${dir}`;
        }
        return {
            latStr: toDMM(lat, true),
            lonStr: toDMM(lon, false)
        };
    }

    function sortPolygonPointsClockwise(points) {
        if (points.length < 3) return points;

        let centerLat = 0, centerLon = 0;
        points.forEach(p => {
            centerLat += p.lat;
            centerLon += p.lon;
        });
        centerLat /= points.length;
        centerLon /= points.length;

        return points.slice().sort((a, b) => {
            const angleA = Math.atan2(a.lat - centerLat, a.lon - centerLon);
            const angleB = Math.atan2(b.lat - centerLat, b.lon - centerLon);
            return angleB - angleA;
        });
    }

    function parseCoordinates(text) {
        let cleanText = normalizeChineseCoordText(text);
        cleanText = cleanText.replace(/、/g, ' ').replace(/，/g, ' ').replace(/\\/g, ' ').replace(/\//g, ' ');

        const circleRadiusMatch = text.match(/([\d\.]+)\s*(?:海里|海浬|nm|NM)\s*(?:為|为)?\s*半(?:徑|径)/i) || 
                                  text.match(/半(?:徑|径)\s*(?:為|为)?\s*([\d\.]+)\s*(?:海里|海浬|nm|NM)/i);

        if (circleRadiusMatch) {
            const radiusNM = parseFloat(circleRadiusMatch[1]);
            const coords = parsePointsFromText(cleanText);
            if (coords.points.length >= 1) {
                return {
                    type: 'circle',
                    points: [coords.points[0]],
                    radiusNM: radiusNM,
                    invalidCount: coords.invalidCount
                };
            }
        }

        const polygonResult = parsePointsFromText(cleanText);
        const sortedPoints = sortPolygonPointsClockwise(polygonResult.points);

        return {
            type: 'polygon',
            points: sortedPoints,
            radiusNM: 0,
            invalidCount: polygonResult.invalidCount
        };
    }

    function parsePointsFromText(cleanText) {
        const coords = [];
        let invalidCount = 0;

        const pushIfValid = (lat, lon) => {
            if (lat === null || lon === null || isNaN(lat) || isNaN(lon)) return;
            if (Math.abs(lat) > 90 || Math.abs(lon) > 180) { invalidCount++; return; }
            coords.push({ lat, lon });
        };

        const suffixRegex = /([\d°'\"\.\-\s]+[NSns])\s*[,;、\s]*\s*([\d°'\"\.\-\s]+[EWew])/g;
        let match;
        while ((match = suffixRegex.exec(cleanText)) !== null) {
            pushIfValid(parseSingleCoordinate(match[1], false), parseSingleCoordinate(match[2], true));
        }

        if (coords.length === 0) {
            const prefixRegex = /([NSns][\d°'\"\.\-\s]+)\s*[,;、\s]*\s*([EWew][\d°'\"\.\-\s]+)/g;
            while ((match = prefixRegex.exec(cleanText)) !== null) {
                pushIfValid(parseSingleCoordinate(match[1], false), parseSingleCoordinate(match[2], true));
            }
        }

        if (coords.length === 0) {
            const decimalRegex = /(-?\d+\.\d+)\s*[,;\s]+\s*(-?\d+\.\d+)/g;
            while ((match = decimalRegex.exec(cleanText)) !== null) {
                pushIfValid(parseFloat(match[1]), parseFloat(match[2]));
            }
        }

        return { points: coords, invalidCount };
    }

    /* 全面強化版時間與元資料解析引擎 */
    function extractMetadata(rawText) {
        let title = "航警";
        let location = "海域";
        let timeRange = "X月X日XXXX時至X月X日XXXX時";
        let purpose = "軍事演習";

        // 1. 標題 (如：瓊航警160/26)
        const titleMatch = rawText.match(/([\u4e00-\u9fa5]{1,2}航警\s*[\d\/]+)/);
        if (titleMatch) title = titleMatch[1].replace(/\s+/g, '');

        // 2. 海域
        const locMatch = rawText.match(/(南海|東海|黃海|渤海|北部灣|台灣海峽|臺灣海峽|珠江口|北部湾)/);
        if (locMatch) {
            location = locMatch[1].replace('北部湾', '北部灣').replace('臺灣海峽', '台灣海峽');
        }

        // 3. 全面優化時間提取邏輯
        // 模式 A：每日循環模式 (如：自8月12日至8月18日，每日0900时至1800时)
        const patternDaily = /(?:自)?\s*(\d{1,2}月\d{1,2}日)\s*(?:至|-|~|—)\s*(\d{1,2}月\d{1,2}日)\s*[,，、\s]*\s*(?:每日|每天)\s*(\d{4})\s*(?:[時时])?\s*(?:至|-|~|—)\s*(\d{4})\s*[時时]?/;
        
        // 模式 B：跨日連續模式 (如：自8月12日0900时至8月18日1800时)
        const patternFull = /(?:自)?\s*(\d{1,2}月\d{1,2}日)\s*(\d{4})\s*(?:[時时])?\s*(?:至|-|~|—)\s*(\d{1,2}月\d{1,2}日)\s*(\d{4})\s*[時时]?/;
        
        // 模式 C：單日模式 (如：自8月12日0900时至1800时)
        const patternSingle = /(?:自)?\s*(\d{1,2}月\d{1,2}日)\s*(\d{4})\s*(?:[時时])?\s*(?:至|-|~|—)\s*(\d{4})\s*[時时]?/;

        const mDaily = rawText.match(patternDaily);
        const mFull = rawText.match(patternFull);
        const mSingle = rawText.match(patternSingle);

        if (mDaily) {
            timeRange = `${mDaily[1]}至${mDaily[2]}，每日${mDaily[3]}時至${mDaily[4]}時`;
        } else if (mFull) {
            timeRange = `${mFull[1]}${mFull[2]}時至${mFull[3]}${mFull[4]}時`;
        } else if (mSingle) {
            timeRange = `${mSingle[1]}${mSingle[2]}時至${mSingle[3]}時`;
        } else {
            // 備用匹配：若上述正則均未命中，提取所有出現的月日與 4 位數時間
            const dates = rawText.match(/\d{1,2}月\d{1,2}日/g);
            const times = rawText.match(/\b\d{4}\b/g);
            const hasDaily = /每日|每天/.test(rawText);

            if (dates && dates.length >= 2 && times && times.length >= 2) {
                if (hasDaily) {
                    timeRange = `${dates[0]}至${dates[1]}，每日${times[0]}時至${times[1]}時`;
                } else {
                    timeRange = `${dates[0]}${times[0]}時至${dates[1]}${times[1]}時`;
                }
            } else if (dates && dates.length >= 1 && times && times.length >= 2) {
                timeRange = `${dates[0]}${times[0]}時至${times[1]}時`;
            }
        }

        // 4. 性質/目的
        if (rawText.includes("火箭發射") || rawText.includes("火箭发射")) purpose = "火箭發射";
        else if (rawText.includes("實彈") || rawText.includes("实弹")) purpose = "實彈射擊";
        else if (rawText.includes("軍事訓練") || rawText.includes("军事训练")) purpose = "軍事訓練";
        else if (rawText.includes("軍事演習") || rawText.includes("军事演习")) purpose = "軍事演習";
        else if (rawText.includes("軍事任務") || rawText.includes("军事任务")) purpose = "軍事任務";

        return { title, location, timeRange, purpose };
    }

    function buildFormattedText(area) {
        const meta = area.meta;
        // 避免出現 "自自..." 重複詞
        const timePrefix = meta.timeRange.startsWith('自') ? '' : '自';

        if (area.type === 'circle') {
            const formatted = formatCoordString(area.points[0].lat, area.points[0].lon);
            return `${meta.title}，${meta.location}，${timePrefix}${meta.timeRange}，在以${formatted.latStr} ${formatted.lonStr}為中心，${area.radiusNM}海里為半徑的圓形區域內進行${meta.purpose}，禁止駛入。\n(初判： )`;
        } else {
            let coordLines = "";
            area.points.forEach((p, idx) => {
                const formatted = formatCoordString(p.lat, p.lon);
                coordLines += `(${idx + 1}) ${formatted.latStr} ${formatted.lonStr}\n`;
            });
            return `${meta.title}，${meta.location}，${timePrefix}${meta.timeRange}，在\n${coordLines}諸點連線範圍內進行${meta.purpose}，禁止駛入。\n(初判： )`;
        }
    }

    function computePolygonCentroid(points) {
        let area = 0, cx = 0, cy = 0;
        const n = points.length;
        for (let i = 0; i < n; i++) {
            const p1 = points[i];
            const p2 = points[(i + 1) % n];
            const cross = p1.lon * p2.lat - p2.lon * p1.lat;
            area += cross;
            cx += (p1.lon + p2.lon) * cross;
            cy += (p1.lat + p2.lat) * cross;
        }
        area = area / 2;
        if (Math.abs(area) < 1e-9) {
            let latSum = 0, lonSum = 0;
            points.forEach(p => { latSum += p.lat; lonSum += p.lon; });
            return { lat: latSum / n, lon: lonSum / n };
        }
        cx = cx / (6 * area);
        cy = cy / (6 * area);
        return { lat: cy, lon: cx };
    }

    function computeBoundingExtent(points) {
        let minLat = 90, maxLat = -90, minLon = 180, maxLon = -180;
        points.forEach(p => {
            minLat = Math.min(minLat, p.lat); maxLat = Math.max(maxLat, p.lat);
            minLon = Math.min(minLon, p.lon); maxLon = Math.max(maxLon, p.lon);
        });
        return Math.max(maxLat - minLat, maxLon - minLon);
    }

    function computeEdgeLabelPosition(p1, p2, centroid, offsetDeg) {
        const midLat = (p1.lat + p2.lat) / 2;
        const midLon = (p1.lon + p2.lon) / 2;
        let dirLat = midLat - centroid.lat;
        let dirLon = midLon - centroid.lon;
        const dirLen = Math.sqrt(dirLat * dirLat + dirLon * dirLon) || 1;
        dirLat /= dirLen; dirLon /= dirLen;
        return { lat: midLat + dirLat * offsetDeg, lon: midLon + dirLon * offsetDeg };
    }

    function renderParseStatus(cardId, result, rawText) {
        const statusEl = document.getElementById(`status-${cardId}`);
        if (!statusEl) return;
        statusEl.style.display = 'block';

        if (!rawText) {
            statusEl.className = 'parse-status';
            statusEl.style.display = 'none';
            return;
        }

        if (result.type === 'circle') {
            const f = formatCoordString(result.points[0].lat, result.points[0].lon);
            statusEl.className = 'parse-status ok';
            statusEl.innerHTML = `✅ 成功解析【圓形禁航區】：<br>圓心：${f.latStr} ${f.lonStr}<br>半徑：${result.radiusNM} 海里`;
            return;
        }

        if (result.points.length < 3) {
            statusEl.className = 'parse-status fail';
            let msg = `⚠️ 解析失敗：只找到 ${result.points.length} 個有效座標點（至少需要 3 點才能構成多邊形）。`;
            if (result.invalidCount > 0) msg += ` 另有 ${result.invalidCount} 個座標數值超出合理範圍，已被忽略。`;
            statusEl.innerHTML = msg;
            return;
        }

        const preview = result.points.map((p, i) => {
            const f = formatCoordString(p.lat, p.lon);
            return `(${i + 1}) ${f.latStr} ${f.lonStr}`;
        }).join('\n');

        if (result.invalidCount > 0) {
            statusEl.className = 'parse-status warn';
            statusEl.innerHTML = `⚠️ 成功解析 ${result.points.length} 點（已自動進行環狀順序重排），但另有 ${result.invalidCount} 個座標數值超出合理範圍已被忽略：<div class="coord-preview">${preview}</div>`;
        } else {
            statusEl.className = 'parse-status ok';
            statusEl.innerHTML = `✅ 成功解析 ${result.points.length} 點多邊形（已自動進行環狀順序重排，防止邊線交叉）：<div class="coord-preview">${preview}</div>`;
        }
    }

    function processAllData() {
        // 清除地圖舊圖層
        Object.keys(areaMapObjects).forEach(cardId => removeAreaFromMap(cardId));
        areaMapObjects = {};
        allParsedAreas = [];

        const cards = document.querySelectorAll('.area-card');
        let featureGroup = L.featureGroup();

        cards.forEach((card) => {
            const cardId = card.id;
            const num = card.dataset.num;
            const text = card.querySelector('.area-input').value.trim();
            const result = parseCoordinates(text);

            renderParseStatus(cardId, result, text);

            if (!text) return;
            if (result.type === 'polygon' && result.points.length < 3) return;
            if (result.type === 'circle' && result.points.length < 1) return;

            const points = result.points;
            const meta = extractMetadata(text);
            const areaData = { cardId, num, text, type: result.type, points, radiusNM: result.radiusNM, meta };
            allParsedAreas.push(areaData);

            let shapeLayer = null;
            let currentLabels = [];

            if (result.type === 'circle') {
                const radiusMeters = result.radiusNM * 1852;
                shapeLayer = L.circle([points[0].lat, points[0].lon], {
                    radius: radiusMeters,
                    color: 'red',
                    weight: 3,
                    fillColor: 'red',
                    fillOpacity: 0.4
                }).addTo(map);

                featureGroup.addLayer(shapeLayer);

                const latOffset = (result.radiusNM / 60) * 1.05;
                const labelIcon = L.divIcon({
                    className: 'dist-label',
                    html: `${result.radiusNM}浬 (半徑)`,
                    iconSize: [80, 20],
                    iconAnchor: [40, 10]
                });
                const marker = L.marker([points[0].lat + latOffset, points[0].lon], { icon: labelIcon });
                currentLabels.push(marker);
                if (showLabels) marker.addTo(map);

            } else {
                const latLngs = points.map(p => [p.lat, p.lon]);
                shapeLayer = L.polygon(latLngs, {
                    color: 'red',
                    weight: 3,
                    fillColor: 'red',
                    fillOpacity: 0.4
                }).addTo(map);

                featureGroup.addLayer(shapeLayer);

                const centroid = computePolygonCentroid(points);
                const extent = computeBoundingExtent(points);
                const offsetDeg = Math.max(extent * 0.06, 0.02);

                for (let i = 0; i < points.length; i++) {
                    const p1 = points[i];
                    const p2 = points[(i + 1) % points.length];
                    const dist = calculateDistanceNM(p1.lat, p1.lon, p2.lat, p2.lon);
                    const labelPos = computeEdgeLabelPosition(p1, p2, centroid, offsetDeg);

                    const labelIcon = L.divIcon({
                        className: 'dist-label',
                        html: `${dist}浬`,
                        iconSize: [42, 20],
                        iconAnchor: [21, 10]
                    });

                    const marker = L.marker([labelPos.lat, labelPos.lon], { icon: labelIcon });
                    currentLabels.push(marker);
                    if (showLabels) marker.addTo(map);
                }
            }

            // 紀錄區域對象
            areaMapObjects[cardId] = {
                shape: shapeLayer,
                labels: currentLabels,
                visible: true
            };

            // 重置卡片按鈕狀態
            const visBtn = document.getElementById(`btn-vis-${cardId}`);
            if (visBtn) {
                visBtn.innerText = '👁 顯示';
                visBtn.classList.remove('hidden-state');
            }
        });

        if (allParsedAreas.length === 0) {
            alert('沒有解析到任何有效的禁航區座標！請查看各區塊下方的解析狀態提示。');
            document.getElementById('output-section').style.display = 'none';
            return;
        }

        map.fitBounds(featureGroup.getBounds(), { padding: [50, 50] });
        renderAreaOutputs();
        document.getElementById('output-section').style.display = 'block';
    }

    function clearAllData() {
        // 清除地圖上的所有圖層與標籤
        Object.keys(areaMapObjects).forEach(cardId => removeAreaFromMap(cardId));
        areaMapObjects = {};
        allParsedAreas = [];

        // 清空所有卡片中的使用者輸入與解析狀態
        const inputs = document.querySelectorAll('.area-input');
        inputs.forEach(input => input.value = '');

        const statusEls = document.querySelectorAll('.parse-status');
        statusEls.forEach(el => {
            el.style.display = 'none';
            el.innerHTML = '';
        });

        // 隱藏並清空 PPT 輸出區
        document.getElementById('output-section').style.display = 'none';
        document.getElementById('areaOutputContainer').innerHTML = '';
    }

    function renderAreaOutputs() {
        const container = document.getElementById('areaOutputContainer');
        container.innerHTML = '';

        allParsedAreas.forEach((area) => {
            const blockId = `output-${area.cardId}`;
            const titleDesc = area.type === 'circle' ? `圓形 (半徑 ${area.radiusNM} 浬)` : `多邊形 (${area.points.length} 點)`;
            const html = `
                <div class="area-output" id="${blockId}" data-card-id="${area.cardId}">
                    <div class="area-output-header">
                        <span>【區域 #${area.num}】${titleDesc}</span>
                        <button class="btn-copy-single" onclick="copySingleText('${area.cardId}')">📋 複製本區文字</button>
                    </div>
                    <div class="meta-edit">
                        <label>標題
                            <input type="text" data-field="title" value="${escapeAttr(area.meta.title)}" oninput="updateAreaMeta('${area.cardId}', this)">
                        </label>
                        <label>海域
                            <input type="text" data-field="location" value="${escapeAttr(area.meta.location)}" oninput="updateAreaMeta('${area.cardId}', this)">
                        </label>
                        <label style="grid-column: span 2;">時間
                            <input type="text" data-field="timeRange" value="${escapeAttr(area.meta.timeRange)}" oninput="updateAreaMeta('${area.cardId}', this)">
                        </label>
                        <label style="grid-column: span 2;">性質
                            <input type="text" data-field="purpose" value="${escapeAttr(area.meta.purpose)}" oninput="updateAreaMeta('${area.cardId}', this)">
                        </label>
                    </div>
                    <div class="formatted-text-single" id="text-${area.cardId}"></div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
            document.getElementById(`text-${area.cardId}`).innerText = buildFormattedText(area);
        });
    }

    function copySingleText(cardId) {
        const textEl = document.getElementById(`text-${cardId}`);
        if (!textEl) return;
        navigator.clipboard.writeText(textEl.innerText).then(() => {
            alert('已複製該區域 PPT 文字內容！');
        }).catch(err => {
            alert('複製失敗：' + err);
        });
    }

    function escapeAttr(str) {
        return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function updateAreaMeta(cardId, inputEl) {
        const area = allParsedAreas.find(a => a.cardId === cardId);
        if (!area) return;
        const field = inputEl.dataset.field;
        area.meta[field] = inputEl.value;
        const textEl = document.getElementById(`text-${cardId}`);
        if (textEl) textEl.innerText = buildFormattedText(area);
    }

    function toggleLabelVisibility() {
        showLabels = document.getElementById('toggleLabels').checked;
        Object.keys(areaMapObjects).forEach(cardId => {
            const obj = areaMapObjects[cardId];
            if (obj.visible) {
                obj.labels.forEach(m => {
                    if (showLabels) {
                        if (!map.hasLayer(m)) m.addTo(map);
                    } else {
                        if (map.hasLayer(m)) map.removeLayer(m);
                    }
                });
            }
        });
    }

    function generateCircleKMLCoords(centerLat, centerLon, radiusNM, numPoints = 64) {
        const coords = [];
        const R = 6371;
        const radiusKm = radiusNM * 1.852;
        const latRad = centerLat * Math.PI / 180;
        const lonRad = centerLon * Math.PI / 180;
        const d = radiusKm / R;

        for (let i = 0; i <= numPoints; i++) {
            const bearing = (i * 360 / numPoints) * Math.PI / 180;
            const pLat = Math.asin(Math.sin(latRad) * Math.cos(d) + Math.cos(latRad) * Math.sin(d) * Math.cos(bearing));
            const pLon = lonRad + Math.atan2(Math.sin(bearing) * Math.sin(d) * Math.cos(latRad), Math.cos(d) - Math.sin(latRad) * Math.sin(pLat));
            coords.push(`${(pLon * 180 / Math.PI).toFixed(6)},${(pLat * 180 / Math.PI).toFixed(6)},0`);
        }
        return coords.join('\n');
    }

    function downloadKML() {
        if (allParsedAreas.length === 0) {
            alert('請先點擊「一鍵繪製」！');
            return;
        }

        let kmlFolders = "";

        allParsedAreas.forEach((area) => {
            let kmlCoords = "";

            if (area.type === 'circle') {
                kmlCoords = generateCircleKMLCoords(area.points[0].lat, area.points[0].lon, area.radiusNM);
            } else {
                kmlCoords = area.points.map(p => `${p.lon},${p.lat},0`).join('\n');
                kmlCoords += `\n${area.points[0].lon},${area.points[0].lat},0`;
            }

            let placemarks = `
    <Placemark>
      <name>禁航區 #${area.num} (${area.type === 'circle' ? '圓形' : '多邊形'})</name>
      <description><![CDATA[${buildFormattedText(area).replace(/\n/g, '<br>')}]]></description>
      <styleUrl>#redAreaStyle</styleUrl>
      <Polygon>
        <outerBoundaryIs>
          <LinearRing>
            <coordinates>
${kmlCoords}
            </coordinates>
          </LinearRing>
        </outerBoundaryIs>
      </Polygon>
    </Placemark>`;

            if (showLabels) {
                if (area.type === 'circle') {
                    const latOffset = (area.radiusNM / 60) * 1.05;
                    placemarks += `
        <Placemark>
            <name>#${area.num}: ${area.radiusNM}浬 (半徑)</name>
            <Style>
                <IconStyle><Icon/></IconStyle>
                <LabelStyle>
                    <color>ff00ffff</color>
                    <scale>1.1</scale>
                </LabelStyle>
            </Style>
            <Point>
                <coordinates>${area.points[0].lon},${area.points[0].lat + latOffset},0</coordinates>
            </Point>
        </Placemark>`;
                } else {
                    const centroid = computePolygonCentroid(area.points);
                    const extent = computeBoundingExtent(area.points);
                    const offsetDeg = Math.max(extent * 0.06, 0.02);

                    for (let i = 0; i < area.points.length; i++) {
                        const p1 = area.points[i];
                        const p2 = area.points[(i + 1) % area.points.length];
                        const dist = calculateDistanceNM(p1.lat, p1.lon, p2.lat, p2.lon);
                        const labelPos = computeEdgeLabelPosition(p1, p2, centroid, offsetDeg);

                        placemarks += `
        <Placemark>
            <name>#${area.num}: ${dist}浬</name>
            <Style>
                <IconStyle><Icon/></IconStyle>
                <LabelStyle>
                    <color>ff00ffff</color>
                    <scale>1.1</scale>
                </LabelStyle>
            </Style>
            <Point>
                <coordinates>${labelPos.lon},${labelPos.lat},0</coordinates>
            </Point>
        </Placemark>`;
                    }
                }
            }

            kmlFolders += `
    <Folder>
      <name>禁航區 #${area.num}</name>
      ${placemarks}
    </Folder>`;
        });

        const kmlContent = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>禁航區圖資</name>

    <Style id="redAreaStyle">
      <LineStyle>
        <color>ff0000ff</color>
        <width>3</width>
      </LineStyle>
      <PolyStyle>
        <color>800000ff</color>
      </PolyStyle>
    </Style>

    ${kmlFolders}

  </Document>
</kml>`;

        const blob = new Blob([kmlContent], { type: 'application/vnd.google-earth.kml+xml' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = '禁航區圖資.kml';
        link.click();
    }
</script>

</body>
</html>
